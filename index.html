<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Let's Connect Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

:root{
  --bg:#0D0D0D;
  --surface:#151515;
  --primary:#00FF7F;
  --secondary:#00C853;
  --accent:#69F0AE;
  --text:#7CFFB2;
  --muted:#7CFFB2aa;
  --glow:0 0 8px rgba(0,255,127,.35),0 0 20px rgba(0,200,83,.25);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}

#contact{
  max-width:1200px;
  margin:auto;
  padding:100px 24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
}

#contact h2{
  font-family:'Poppins',sans-serif;
  font-size:2.8rem;
  color:#fff;
}
#contact h2 em{
  font-style:italic;
  color:var(--primary);
  text-shadow:var(--glow);
}

#contact > div:first-child p{
  margin:24px 0 32px;
  color:var(--muted);
  font-size:1.05rem;
  max-width:420px;
}
#contact > div:first-child p a{
  color:var(--primary);
  text-decoration:underline;
}

.connect-links{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.connect-links a{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 22px;
  border-radius:999px;
  border:1px solid rgba(0,200,83,.35);
  background:var(--surface);
  color:var(--primary);
  font-weight:700;
  font-size:.8rem;
  letter-spacing:.05em;
  text-decoration:none;
  transition:.25s;
  box-shadow:0 0 20px rgba(0,200,83,.15);
}
.connect-links a:hover{
  background:var(--secondary);
  color:#050505;
  transform:translateY(-2px);
}
.connect-links svg{width:16px;height:16px;stroke:currentColor}

form{
  display:flex;
  flex-direction:column;
  gap:22px;
}
label{
  display:block;
  font-size:.75rem;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--accent);
  margin-bottom:8px;
  text-transform:uppercase;
}
input, textarea{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid rgba(124,255,178,.25);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:1rem;
  padding:8px 2px;
  outline:none;
  transition:.25s;
}
textarea{
  border:1px solid rgba(124,255,178,.25);
  border-radius:12px;
  padding:14px;
  min-height:110px;
  resize:vertical;
  background:var(--surface);
}
input::placeholder, textarea::placeholder{
  color:rgba(124,255,178,.4);
}
input:focus, textarea:focus{
  border-color:var(--primary);
}

.send-btn{
  margin-top:8px;
  padding:16px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--secondary),var(--accent));
  color:#050505;
  font-weight:800;
  letter-spacing:.05em;
  font-size:.9rem;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,200,83,.35);
  transition:.25s;
}
.send-btn:hover{transform:translateY(-2px)}

.fallback{
  font-size:.85rem;
  color:var(--muted);
}
.fallback a{color:var(--primary);text-decoration:underline}

@media(max-width:800px){
  #contact{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="contact">
  <div>
    <h2>Let's <em>Connect</em></h2>
    <p>Speaking inquiries, partnerships, and collaborations. Submitting this form drafts an email to
       to <a href="mahamspeaks@gmail.com">mahamspeaks@gmail.com</a>.</p>
    <div class="connect-links">
      <a href="mailto:mahamspeaks@gmail.com?subject=Speaking%20Inquiry%20%2F%20Partnership">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>
        EMAIL
      </a>
      <a href="https://www.linkedin.com/in/mgkhalid/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 3h5v5"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
        LINKEDIN
      </a>
      <a href="https://revohub.ca/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 3h5v5"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
        REVOHUB
      </a>
    </div>
  </div>

  <form>
    <div>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name">
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Your email address">
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" placeholder="Tell me a little about your event / partnership / request"></textarea>
    </div>
    <button type="submit" class="send-btn">SEND MESSAGE</button>
    <p class="fallback">Prefer direct email? <a href="mailto:hello@revohub.ca">Open your email composer</a>.</p>
  </form>
</section>

</body>
</html>
