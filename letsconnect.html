<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Let's Connect Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

:root{
    --primary:#E0E0E0;        /* Light grey */
    --secondary:#9E9E9E;      /* Medium grey */
    --accent:#BDBDBD;         /* Silver */
    --bg:#0D0D0D;             /* Deep black */
    --surface:#151515;        /* Dark grey */
    --text:#F5F5F5;           /* White */
    --muted:#B0B0B0;          /* Muted grey */
    --shadow:0 12px 32px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

h1,h2,h3,.logo{
    font-family:'Poppins',sans-serif;
    color:var(--primary);
}

a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* NAVIGATION */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(15,15,15,.92);
    backdrop-filter:blur(10px);
    box-shadow:var(--shadow);
}

.navbar{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 24px;
}

.logo{
    font-size:1.5rem;
    font-weight:800;
    color:var(--accent);
}

.nav-links{
    display:flex;
    gap:24px;
    list-style:none;
}

.nav-links a{
    font-weight:600;
    color:var(--muted);
    transition:.25s;
}

.nav-links a:hover{
    color:var(--accent);
}

/* HERO */

.hero{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:50px;
    align-items:center;
    padding:100px 8%;
    background:linear-gradient(135deg,#111,#333);
    color:#fff;
    border-radius:0 0 32px 32px;
}

.hero-title{
    font-size:3.5rem;
    line-height:1.1;
}

.hero-subtitle{
    margin:24px 0;
    font-size:1.15rem;
    opacity:.95;
}

.profile img{
    width:340px;
    height:340px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid rgba(255,255,255,.2);
    margin:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:999px;
    background:linear-gradient(135deg,#444,#777);
    color:#050505;
    font-weight:700;
    transition:.25s;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.btn:hover{
    transform:translateY(-3px);
}

.btn.secondary{
    background:#ffffff22;
    border:1px solid #ffffff55;
    color:#fff;
}

/* SECTIONS */

section{
    max-width:1200px;
    margin:auto;
    padding:80px 24px;
}

section h2{
    font-size:2.3rem;
    color:var(--accent);
    margin-bottom:24px;
    position:relative;
}

section h2:after{
    content:"";
    display:block;
    width:80px;
    height:4px;
    background:var(--accent);
    margin-top:10px;
    border-radius:2px;
}

section p{
    color:var(--muted);
}

/* TIMELINE */

.timeline{
    border-left:4px solid var(--accent);
    padding-left:28px;
}

.timeline-item{
    background:var(--surface);
    padding:24px;
    border-radius:18px;
    box-shadow:var(--shadow);
    margin-bottom:24px;
    border:1px solid rgba(255,255,255,.15);
}

.timeline-item span{
    color:var(--accent);
    font-weight:700;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:24px;
}

.card{
    background:var(--surface);
    border-radius:18px;
    padding:30px;
    box-shadow:var(--shadow);
    transition:.25s;
    border:1px solid rgba(255,255,255,.15);
}

.card:hover{
    transform:translateY(-6px);
}

.card h3{
    color:var(--primary);
    margin-bottom:10px;
}

/* REVOHUB BOX */

.revohub-box{
    background:var(--surface);
    border-radius:18px;
    padding:30px;
    box-shadow:var(--shadow);
    transition:.25s;
    border:1px solid rgba(255,255,255,.15);
    text-align:center;
}

.revohub-box:hover{
    transform:translateY(-6px);
}

/* TOPICS */

.topics ul{
    list-style:none;
}

.topics li{
    background:var(--surface);
    padding:16px 20px;
    margin:12px 0;
    border-left:5px solid var(--accent);
    border-radius:12px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.15);
}

/* CONTACT */

#contact{
    padding:0;
}

/* FOOTER */

footer{
    margin-top:40px;
    background:#111;
    color:#fff;
    text-align:center;
    padding:40px 24px;
}

/* MOBILE */

@media(max-width:900px){
    .hero{
        grid-template-columns:1fr;
        text-align:center;
        padding:70px 24px;
    }

    .hero-title{
        font-size:2.4rem;
    }

    .buttons{
        justify-content:center;
    }

    .navbar{
        flex-direction:column;
        gap:18px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

    .profile img{
        width:260px;
        height:260px;
    }
}
</style>
</head>
<body>

<section id="contact">
  <div>
    <h2>Let's <em>Connect</em></h2>
    <p>Interested in workforce intelligence, AI transformation, or
       future-ready organisations? Submitting this form drafts an email
       to       <a href="mailto:mahamspeaks@gmail.com?subject=Speaking%20Inquiry%20%2F%20Partnership">mahamspeaks@gmail.com</a>.</p>
    <div class="connect-links">
      <a href="mailto:mahamspeaks@gmail.com?subject=Speaking%20Inquiry%20%2F%20Partnership">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>
        EMAIL
      </a>
      <a href="https://www.linkedin.com/in/mgkhalid/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 3h5v5"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
        LINKEDIN
      </a>
      <a href="https://revohub.ca/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 3h5v5"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
        REVOHUB
      </a>
    </div>
  </div>

  <form>
    <div>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name">
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Your email address">
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" placeholder="Tell me a little about your event / partnership / request"></textarea>
    </div>
    <button type="submit" class="send-btn">SEND MESSAGE</button>
    <p class="fallback">Prefer direct email?  <a href="mailto:mahamspeaks@gmail.com?subject=Speaking%20Inquiry%20%2F%20Partnership">Open your email composer</a>.</p>
  </form>
</section>

</body>
</html>
