<!DOCTYPE html>
<html lang="en">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

:root{
    --primary:#E0E0E0;        /* Light grey */
    --secondary:#9E9E9E;      /* Medium grey */
    --accent:#BDBDBD;         /* Silver */
    --bg:#0D0D0D;             /* Deep black */
    --surface:#151515;        /* Dark grey */
    --text:#F5F5F5;           /* White */
    --muted:#B0B0B0;          /* Muted grey */
    --shadow:0 12px 32px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

h1,h2,h3,.logo{
    font-family:'Poppins',sans-serif;
    color:var(--primary);
}

a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* NAVIGATION */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(15,15,15,.92);
    backdrop-filter:blur(10px);
    box-shadow:var(--shadow);
}

.navbar{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 24px;
}

.logo{
    font-size:1.5rem;
    font-weight:800;
    color:var(--accent);
}

.nav-links{
    display:flex;
    gap:24px;
    list-style:none;
}

.nav-links a{
    font-weight:600;
    color:var(--muted);
    transition:.25s;
}

.nav-links a:hover{
    color:var(--accent);
}

/* HERO */

.hero{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:50px;
    align-items:center;
    padding:100px 8%;
    background:linear-gradient(135deg,#111,#333);
    color:#fff;
    border-radius:0 0 32px 32px;
}

.hero-title{
    font-size:3.5rem;
    line-height:1.1;
}

.hero-subtitle{
    margin:24px 0;
    font-size:1.15rem;
    opacity:.95;
}

.profile img{
    width:340px;
    height:340px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid rgba(255,255,255,.2);
    margin:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

/* BUTTONS */
.work-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 32px;
    margin-top: 20px;
    background: #f3ff9a;
    color: #536000;

    text-decoration: none;

    border-radius: 9px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;

    letter-spacing: 3px;

    transition: 0.25s ease;
}
.work-btn:hover {
    background: #e7f77d;
    transform: translateY(-2px);
}

/* SECTIONS */

section{
    max-width:1200px;
    margin:auto;
    padding:80px 24px;
}

section h2{
    font-size:2.3rem;
    color:var(--accent);
    margin-bottom:24px;
    position:relative;
}

section h2:after{
    content:"";
    display:block;
    width:80px;
    height:4px;
    background:var(--accent);
    margin-top:10px;
    border-radius:2px;
}

section p{
    color:var(--muted);
}

/* TIMELINE */

.timeline{
    border-left:4px solid var(--accent);
    padding-left:28px;
}

.timeline-item{
    background:var(--surface);
    padding:24px;
    border-radius:18px;
    box-shadow:var(--shadow);
    margin-bottom:24px;
    border:1px solid rgba(255,255,255,.15);
}

.timeline-item span{
    color:var(--accent);
    font-weight:700;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:24px;
}

.card{
    background:var(--surface);
    border-radius:18px;
    padding:30px;
    box-shadow:var(--shadow);
    transition:.25s;
    border:1px solid rgba(255,255,255,.15);
}

.card:hover{
    transform:translateY(-6px);
}

.card h3{
    color:var(--primary);
    margin-bottom:10px;
}

/* REVOHUB BOX */

.revohub-box{
    background:var(--surface);
    border-radius:18px;
    padding:30px;
    box-shadow:var(--shadow);
    transition:.25s;
    border:1px solid rgba(255,255,255,.15);
    text-align:center;
}

.revohub-box:hover{
    transform:translateY(-6px);
}

/* TOPICS */

.topics ul{
    list-style:none;
}

.topics li{
    background:var(--surface);
    padding:16px 20px;
    margin:12px 0;
    border-left:5px solid var(--accent);
    border-radius:12px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.15);
}

/* CONTACT */

#contact{
  margin-top:10px;
  padding:80px 8% 100px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:start;
}

#contact h2{
    font-size:2.3rem;
    color:var(--accent);
    margin-bottom:20px;
}

#contact h2:after{
    content:"";
    display:block;
    width:80px;
    height:4px;
    background:var(--accent);
    margin-top:10px;
    border-radius:2px;
}

#contact > div > p{
    color:var(--muted);
    margin-bottom:28px;
}

.connect-links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.connect-links a{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:14px 18px;
    font-weight:600;
    color:var(--text);
    box-shadow:var(--shadow);
    transition:.25s;
}

.connect-links a:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
}

.connect-links svg{
    width:20px;
    height:20px;
    stroke:var(--accent);
    flex-shrink:0;
}

/* FORM */

form{
    background:var(--surface);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:32px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:18px;
}

form label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:var(--primary);
    font-size:.9rem;
}

form input,
form textarea{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.2);
    background:#0d0d0d;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:.95rem;
}

form input:focus,
form textarea:focus{
    outline:none;
    border-color:var(--accent);
}

form textarea{
    min-height:120px;
    resize:vertical;
}

.send-btn{
    align-self:flex-start;
    padding:14px 32px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#444,#777);
    color:#050505;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.25s;
}

.send-btn:hover{
    transform:translateY(-3px);
}

.fallback{
    font-size:.85rem;
    color:var(--muted);
    margin-top:4px;
}

.fallback a{
    color:var(--accent);
    text-decoration:underline;
}

@media(max-width:900px){
    #contact{
        grid-template-columns:1fr;
        padding:60px 24px 80px;
    }
}

/* FOOTER */

footer{
    margin-top:40px;
    background:#111;
    color:#fff;
    text-align:center;
    padding:40px 24px;
}

/* MOBILE */

@media(max-width:900px){
    .hero{
        grid-template-columns:1fr;
        text-align:center;
        padding:70px 24px;
    }

    .hero-title{
        font-size:2.4rem;
    }

    .buttons{
        justify-content:center;
    }

    .navbar{
        flex-direction:column;
        gap:18px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

    .profile img{
        width:260px;
        height:260px;
    }
}
</style>
<head>
<meta charset="UTF-8">
<title>Let's Connect Preview</title>
</head>
<body>
 <section id="contact">

    <!-- LEFT SIDE -->
    <div>

      <h2>Let's <em>Connect</em></h2>

      <p>
        Interested in workforce intelligence, AI transformation, or
        future-ready organisations? Submitting this form drafts an email
        to
        <a href="mailto:mahamspeaks@gmail.com?subject=Speaking%20Inquiry%20%2F%20Partnership">
          mahamspeaks@gmail.com.
        </a>
      </p>

      <!-- CONTACT LINKS -->
      <div class="connect-links">

        <a href="mailto:mahamspeaks@gmail.com?subject=Speaking%20Inquiry%20%2F%20Partnership">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 3h5v5" />
            <path d="M10 14L21 3" />
            <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
          </svg>
          EMAIL
        </a>

        <a href="https://www.linkedin.com/in/mgkhalid/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 3h5v5" />
            <path d="M10 14L21 3" />
            <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
          </svg>
          LINKEDIN
        </a>

        <a href="https://revohub.ca/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 3h5v5" />
            <path d="M10 14L21 3" />
            <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
          </svg>
          REVOHUB
        </a>

      </div>

    </div>


    <!-- RIGHT SIDE - FORM -->
   <form id="contactForm">

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Your email address" required>

    <label for="message">Message</label>
    <textarea id="message"
        placeholder="Tell me a little about your event / partnership / request"
        required></textarea>

    <button type="submit" class="send-btn">
        SEND MESSAGE
    </button>
   </form>
 </section>
<script>
document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    // Your email address
    const recipient = "mahamspeaks@gmail.com";

    // Email subject
    const subject = "New Speaking Enquiry - " + name;

    // Professional email format
    const body =
        "NEW SPEAKING ENQUIRY\n" +
        "====================\n\n" +

        "Hello,\n\n" +
        "You have received a new speaking enquiry through your website.\n\n" +

        "CONTACT DETAILS\n" +
        "----------------\n" +
        "Name: " + name + "\n" +
        "Email: " + email + "\n\n" +

        "ENQUIRY\n" +
        "-------\n" +
        message + "\n\n" +

        "Kind regards,\n" +
        "Website Contact Form";

    // Open Outlook/email composer
    window.location.href =
        "mailto:" + recipient +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
});
</script>
</body>
</html>
